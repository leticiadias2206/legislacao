<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legislação e Assuntos Regulatórios — 3º Bimestre</title>
<style>
:root{--navy:#1f3558;--blue:#315f9d;--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e1ee;--ok:#146c43;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;padding:28px 18px 20px}.wrap{max-width:1150px;margin:auto}.title{margin:0;font-size:clamp(25px,4vw,40px)}.subtitle{margin:8px 0 18px;opacity:.9}
#weekNav{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.weekBtn,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.weekBtn{background:#ffffff1d;color:white;border:1px solid #ffffff35}.weekBtn.active{background:white;color:var(--navy)}
main{max-width:1150px;margin:26px auto;padding:0 18px 50px}.week{display:none}.week.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 8px 25px rgba(28,49,84,.06)}h1,h2,h3{margin-top:0}h2{color:var(--navy)}p,li{line-height:1.65}.weekHead{background:linear-gradient(135deg,#fff,#edf3fb);border-left:6px solid var(--blue)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabBtn{padding:10px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;cursor:pointer}.tabBtn.active{background:var(--navy);color:#fff}.tab{display:none}.tab.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.box{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fafcff}.box b{color:var(--navy)}.note{background:#edf4ff;border-left:5px solid var(--blue);padding:16px;border-radius:10px;margin:14px 0}.review{background:#f8fafc;border:1px dashed #b8c7dc;padding:18px;border-radius:12px}.btn{background:var(--navy);color:white}.btn.secondary{background:#e9eef6;color:var(--navy)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.flash{cursor:pointer;perspective:1000px}.flashin{height:200px;position:relative;transform-style:preserve-3d;transition:.5s}.flash.flip .flashin{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:15px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#fff;font-size:19px;font-weight:700}.back{transform:rotateY(180deg);background:#edf4ff;font-size:16px}
.q{font-size:19px;font-weight:800}.opts{display:grid;gap:10px;margin:16px 0}.opt{padding:14px;border:1px solid var(--line);background:white;border-radius:10px;text-align:left;font-weight:650;cursor:pointer}.opt:hover{border-color:var(--blue)}.feedback{display:none;padding:17px;border-radius:12px;margin-top:12px}.feedback.show{display:block}.feedback.ok{background:#eaf7ef;color:#115b36}.feedback.bad{background:#fff0ef;color:#8a201b}.small{font-size:14px;color:var(--muted)}
@media(max-width:600px){.card{padding:18px}.face{font-size:17px}.tabs{display:grid;grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="wrap"><h1 class="title">Legislação e Assuntos Regulatórios</h1><div class="subtitle">3º Bimestre — cada semana está em uma área totalmente separada</div><div id="weekNav"></div></div></header>
<main id="app"></main>
<script>
const weeks=[
{id:'s15',short:'Semana 15',title:'Semana 15 — Autoridades Reguladoras Nacionais de Referência das Américas (ARNr/OPAS)',
sections:[
['OPAS: por que ela existe?','O PDF relaciona a criação da OPAS ao contexto de epidemias que atravessavam fronteiras e mostra a necessidade de cooperação internacional para proteger a saúde. A OPAS trabalha com os países das Américas para melhorar a saúde e a qualidade de vida das populações. O material também destaca que a organização foi fundada em 1902 e é a organização internacional de saúde pública mais antiga do mundo.'],
['O que são as ARNr?','Segundo o material, as Autoridades Reguladoras Nacionais de Referência das Américas são um grupo de reguladores avaliados pela OPAS com qualificação máxima. A ideia é assegurar que medicamentos produzidos e consumidos nos países alcancem níveis adequados de segurança, qualidade e eficácia.'],
['Atuação: autorização e registro','As ARNr revisam e autorizam produtos farmacêuticos, incluindo medicamentos e produtos biológicos, verificando requisitos antes da entrada no mercado.'],
['Atuação: Boas Práticas','Realizam inspeções nacionais e internacionais para verificar se fabricantes cumprem os padrões de qualidade estabelecidos.'],
['Atuação: farmacovigilância','Coletam e analisam dados de segurança. Quando necessário, essas informações podem apoiar a implementação de ações regulatórias.'],
['Atuação: ensaios clínicos','Supervisionam ensaios clínicos para que sejam conduzidos de forma ética e conforme diretrizes internacionais.'],
['Atuação: colaboração internacional','Participam da cooperação regional e internacional para harmonizar padrões, compartilhar melhores práticas, otimizar recursos e fortalecer a confiança.'],
['Anvisa e OPAS','O PDF apresenta a parceria como compartilhamento de conhecimento e adaptação de práticas internacionais às necessidades locais, fortalecendo as operações da Anvisa e o Sistema Nacional de Vigilância Sanitária. Entre algumas ARNr qualificadas existe troca de informações por relatórios de inspeção e documentos técnicos, como parte da construção de confiança e trabalhos conjuntos.']
],
cards:[['O que significa ARNr?','Autoridades Reguladoras Nacionais de Referência das Américas.'],['O que a OPAS faz?','Trabalha com os países das Américas para melhorar a saúde e a qualidade de vida das populações.'],['Quais são áreas de atuação das ARNr?','Registro e autorização, boas práticas, farmacovigilância, ensaios clínicos e colaboração internacional.'],['Por que trocar relatórios de inspeção?','Para compartilhar informações técnicas, construir confiança e fortalecer trabalhos conjuntos.'],['Qual é o objetivo regulatório central?','Proteger a população ajudando a assegurar segurança, qualidade e eficácia.']],
quiz:[
['As ARNr são avaliadas pela:', ['OPAS','Indústria farmacêutica','Hospitais','Universidades'],0,'O material define as ARNr como um grupo de reguladores avaliados pela OPAS com qualificação máxima.'],
['Qual atividade está ligada à coleta e análise de dados de segurança?', ['Publicidade','Farmacovigilância','Venda','Marketing'],1,'A farmacovigilância coleta e analisa dados de segurança e pode apoiar ações regulatórias.'],
['A troca de relatórios de inspeção entre autoridades serve principalmente para:', ['Esconder informações','Construir confiança e permitir trabalho conjunto','Substituir toda fiscalização','Eliminar normas'],1,'O PDF relaciona a troca de documentos técnicos à construção de confiança e a trabalhos conjuntos.']]
},
{id:'s16',short:'Semana 16',title:'Semana 16 — Caso Losartana',
sections:[
['O caso','Em junho de 2022, a Anvisa determinou a interdição e o recolhimento de lotes de medicamentos contendo o princípio ativo losartana. A medida foi tomada porque havia uma impureza em concentração acima do limite de segurança aceitável apresentado no caso.'],
['Por que o recolhimento importa?','O PDF explica que o recolhimento de medicamentos é uma medida preventiva e essencial para evitar riscos à saúde. Ao mesmo tempo, pode gerar preocupação nos pacientes que dependem do tratamento.'],
['Desvio de qualidade','O caso é usado para mostrar que, diante de um desvio de qualidade, a autoridade sanitária pode determinar medidas como interdição e recolhimento de lotes.'],
['Onde buscar informação segura?','O material orienta que notícias sobre determinações sanitárias sejam verificadas nos canais oficiais do Ministério da Saúde e das autoridades responsáveis.'],
['Risco-benefício e orientação','O PDF apresenta uma situação com pacientes alarmados e reforça que mudanças no tratamento não devem ser feitas por conta própria. A orientação profissional é importante para avaliar riscos e benefícios.'],
['Boas Práticas de Fabricação','A semana relaciona o caso às normas de fabricação e destaca a RDC nº 658/2022, apresentada nas referências como norma sobre Diretrizes Gerais de Boas Práticas de Fabricação de Medicamentos.'],
['Confiança e comunicação','O material também discute que casos de recolhimento podem abalar a confiança na marca e na indústria. Por isso, processos transparentes e diálogo contínuo ajudam a lidar com crises de confiança.']
],
cards:[['Por que lotes de losartana foram recolhidos?','Por causa da presença de uma impureza em concentração acima do limite de segurança aceitável no caso estudado.'],['O que a Anvisa pode fazer diante de desvio de qualidade?','Pode determinar medidas sanitárias, como interdição e recolhimento de lotes.'],['Onde checar informações?','Nos canais oficiais das autoridades e do Ministério da Saúde.'],['Qual norma de BPF aparece na semana?','RDC nº 658/2022.'],['Qual erro deve ser evitado?','Interromper ou modificar tratamento por conta própria, sem orientação adequada.']],
quiz:[['O motivo apresentado para o recolhimento dos lotes foi:', ['Uma mudança de preço','Uma impureza acima do limite de segurança aceitável','Falta de publicidade','Troca de embalagem'],1,'A resposta correta é a B porque o PDF relaciona a interdição e o recolhimento à presença de uma impureza acima do limite de segurança aceitável.'],['Ao receber uma notícia sobre recolhimento, a fonte mais segura é:', ['Qualquer postagem','Canais oficiais','Boatos','Publicidade'],1,'O conteúdo estudado orienta a checar informações nos canais oficiais.']]
},
{id:'s17',short:'Semana 17',title:'Semana 17 — Caso T3/T4',
sections:[
['O que aconteceu?','O material apresenta um caso de 2020 em que um erro na manipulação de medicamentos contendo os hormônios tireoidianos T3 e T4 provocou mal-estar em uma paciente, que processou a farmácia.'],
['O que o caso ensina?','Medicamentos manipulados exigem processos controlados. Um erro de manipulação pode comprometer a segurança do paciente e gerar responsabilidade relacionada à falha na prestação do serviço.'],
['Documentação','O PDF reforça que todo o processo de manipulação deve ser documentado e controlado. A documentação permite demonstrar o que foi feito e acompanhar as etapas do processo.'],
['Rastreabilidade','Rastreabilidade significa poder acompanhar e controlar informações e etapas relacionadas ao produto. Ela depende de registros adequados e de processos documentados.'],
['RDC nº 67/2007','A semana destaca a RDC nº 67/2007, que dispõe sobre Boas Práticas de Manipulação de Preparações Magistrais e Oficinais para Uso Humano em farmácias. O material a relaciona aos requisitos mínimos para manipulação, conservação, dispensação, aquisição de matérias-primas e materiais de embalagem.'],
['Ideia principal para a prova','A diferença entre um medicamento industrializado e um manipulado não significa ausência de regras. A manipulação também precisa seguir requisitos e controles para garantir conformidade e segurança.']
],
cards:[['O que aconteceu no caso T3/T4?','Um erro na manipulação provocou mal-estar em uma paciente e levou a processo contra a farmácia.'],['Qual norma é central nesta semana?','RDC nº 67/2007.'],['Por que documentar a manipulação?','Para garantir controle, rastreabilidade e conformidade.'],['O que é rastreabilidade?','Capacidade de acompanhar informações e etapas do processo.'],['O que a RDC nº 67/2007 aborda?','Boas Práticas de Manipulação de Preparações Magistrais e Oficinais para Uso Humano em farmácias.']],
quiz:[['A principal lição do caso T3/T4 é que:', ['Medicamentos manipulados não precisam de regras','Erros de manipulação podem causar danos e gerar responsabilidade','Documentação é opcional','Rastreabilidade não importa'],1,'O caso foi utilizado justamente para mostrar os riscos de falhas na manipulação e a necessidade de boas práticas e controle.'],['A RDC nº 67/2007 está ligada principalmente a:', ['Boas práticas de manipulação','Publicidade','Preços','Importação de alimentos'],0,'O PDF identifica a RDC nº 67/2007 como norma sobre Boas Práticas de Manipulação.']]
},
{id:'s18',short:'Semana 18',title:"Semana 18 — Caso Botica ao Veado d'Ouro",
sections:[
['O caso','Em 1998, empresários da farmácia Botica ao Veado d’Ouro foram condenados a 13 anos de prisão por comercializar placebo em embalagem de Androcur®, medicamento indicado no material como tratamento do câncer de próstata.'],
['Falsificação','O caso é estudado como exemplo de falsificação de medicamentos e mostra como a fraude pode afetar diretamente pacientes e destruir a confiança pública no setor farmacêutico.'],
['A denúncia inicial','O material trabalha a produção de medicamentos falsificados como a principal denúncia inicial do caso.'],
['Registros adulterados','A adulteração dos registros de produção é discutida como tentativa de esconder o real volume da falsificação. Isso mostra por que registros confiáveis são fundamentais para investigação, controle e rastreabilidade.'],
['Consequências para os responsáveis','O conteúdo destaca a prisão como principal consequência para os responsáveis pelo esquema.'],
['Consequências para pacientes','Pacientes tiveram a saúde prejudicada e alguns perderam a confiança no tratamento, chegando a abandoná-lo.'],
['Schering e a vigilância sanitária','O PDF relata que a Schering recebeu uma denúncia de falsificação, identificou um lote que não havia produzido e notificou a Secretaria Nacional de Vigilância Sanitária. Também explica que a Anvisa foi criada em 1999 e ainda não existia quando o caso foi descoberto.'],
['Responsabilidade e indenização','O material apresenta um processo em que o pedido de indenização da viúva foi negado porque, segundo a justificativa discutida na aula, a doença do paciente era grave e o medicamento em condições ideais não teria evitado o falecimento.'],
['Ética','A conclusão da semana é que a ética é essencial na profissão farmacêutica porque decisões profissionais podem afetar diretamente a saúde e a vida das pessoas. Fraudes na comercialização de medicamentos exigem combate rigoroso.']
],
cards:[['O que foi vendido no lugar do medicamento verdadeiro?','Placebo em embalagem de Androcur®, conforme o caso estudado.'],['Qual era a principal fraude?','Falsificação de medicamentos.'],['Por que adulterar registros?','No caso, para esconder o real volume da falsificação.'],['Qual foi uma consequência para os responsáveis?','Prisão, segundo o material.'],['Por que ética é tão importante na farmácia?','Porque decisões profissionais podem afetar diretamente saúde e vida das pessoas.']],
quiz:[['No caso Botica ao Veado d’Ouro, o produto falso era comercializado como:', ['Losartana','Androcur®','Adakveo®','ACNEZil'],1,'A resposta correta é Androcur®, conforme o caso apresentado no PDF.'],['A adulteração dos registros buscava:', ['Melhorar o produto','Esconder o real volume da falsificação','Facilitar a venda legal','Trocar a embalagem'],1,'O material explica que a adulteração buscava esconder o real volume da falsificação.']]
},
{id:'s19',short:'Semana 19',title:'Semana 19 — Medicamentos Suspensos ou Interditados',
sections:[
['Base legal','A semana relembra a Lei nº 6.360/1976 e afirma que medicamentos, insumos farmacêuticos e outros produtos sujeitos à vigilância sanitária só podem ser comercializados após registro no órgão competente.'],
['Caso ACNEZil 5%','Em 2017, a Anvisa proibiu a fabricação e a distribuição do ACNEZil GEL 5% (peróxido de benzoíla). Segundo o material, a fórmula mestra não se enquadrava como gel ou loção conforme informado na embalagem e o produto era vendido na forma farmacêutica creme.'],
['Por que a forma farmacêutica importa?','Gel e creme diferem em composição, textura, absorção e aplicação. Essas características influenciam o uso correto e a ação esperada do produto.'],
['Gel','O material associa o gel, especialmente em contexto de base aquosa, a textura leve e rápida absorção, sendo adequado para situações como pele oleosa e necessidade de sensação menos pesada.'],
['Creme','O creme é apresentado como uma emulsão que pode ter maior capacidade de hidratação e formação de barreira protetora, sendo discutido para situações de pele mais seca.'],
['Risco sanitário','Forma farmacêutica inadequada e comercialização fora das especificações registradas podem comprometer segurança, eficácia e qualidade do tratamento.'],
['O que a Anvisa pode fazer?','O material destaca que a Anvisa pode interditar, apreender e adotar outras medidas de interesse sanitário para garantir conformidade regulatória e proteção da saúde pública.'],
['Farmacovigilância e reações adversas','A farmacovigilância é apresentada como essencial para identificar, notificar e mitigar riscos. O profissional deve ouvir o relato, buscar informações relevantes e agir conforme protocolos de segurança.'],
['Atendimento ao paciente','A semana também trabalha empatia e assertividade diante de conflitos. Segurança no uso de medicamentos é apresentada como esforço coletivo entre fabricantes, autoridades e profissionais de saúde.']
],
cards:[['Qual lei aparece na revisão da semana?','Lei nº 6.360/1976.'],['Qual foi o problema estudado no ACNEZil?','Divergência entre a forma farmacêutica apresentada e as especificações registradas.'],['Gel e creme são iguais?','Não. Diferem em composição, textura, absorção e aplicação.'],['O que a Anvisa pode fazer?','Interditar, apreender e tomar outras medidas de interesse sanitário.'],['Para que serve a farmacovigilância?','Identificar, notificar e mitigar riscos associados ao uso de medicamentos.']],
quiz:[['Por que a forma farmacêutica correta é importante?', ['Porque é apenas estética','Porque pode influenciar segurança, eficácia, qualidade e uso correto','Porque não interfere no tratamento','Apenas para publicidade'],1,'O PDF explica que divergências podem comprometer segurança, eficácia e qualidade do tratamento.'],['Para pele oleosa e rápida absorção, o material associa mais diretamente:', ['Gel','Creme pesado','Pomada','Qualquer forma'],0,'Nas questões da semana, o gel aparece associado à base leve e rápida absorção.']]
},
{id:'s20',short:'Semana 20',title:'Semana 20 — Caso Adakveo',
sections:[
['Registro de medicamentos','O material explica que o registro na Anvisa é um processo pensado para proteger a população por meio da análise cuidadosa do desenvolvimento e da produção dos medicamentos.'],
['Doenças raras e processo especial','Medicamentos inovadores destinados a doenças raras ou sem alternativas terapêuticas disponíveis podem seguir procedimento especial. O PDF relaciona esse tema à RDC nº 205/2017.'],
['Registro com dados preliminares','Para determinados casos, o material explica que não é necessário apresentar todos os resultados clínicos completos no momento do registro. Dados de fases iniciais, como estudos de fase II, podem ser utilizados.'],
['Compromisso posterior','O registro é apresentado como temporário/condicional, com exigência de conclusão e apresentação posterior de estudos mais robustos, geralmente de fase III. O objetivo não é abandonar a comprovação de eficácia e segurança, mas equilibrar acesso e monitoramento.'],
['O que é o Adakveo?','O PDF apresenta o Adakveo® como medicamento biológico desenvolvido para prevenir crises vaso-oclusivas, episódios dolorosos causados pela obstrução do fluxo sanguíneo, em pacientes com anemia falciforme.'],
['Por que o registro foi cancelado?','Segundo o material, estudos clínicos de fase III não demonstraram redução da frequência das crises de dor em comparação ao placebo. Por isso, a Anvisa cancelou o registro.'],
['Doença rara','O PDF informa que, no Brasil, é considerada rara a doença que afeta até 65 pessoas em cada 100 mil indivíduos.'],
['Por que existem incentivos?','Medicamentos para doenças raras envolvem desafios: custos elevados e baixa lucratividade para a indústria, enquanto pacientes podem necessitar urgentemente de tratamentos eficazes e acessíveis. Os incentivos buscam equilibrar o desafio econômico e a necessidade social.'],
['Monitoramento pós-aprovação','A semana reforça que transparência, fiscalização e compromisso da indústria são essenciais. O cancelamento do Adakveo é apresentado não como fracasso da RDC nº 205/2017, mas como exemplo da importância de critérios rigorosos de monitoramento pós-aprovação.']
],
cards:[['O que é o Adakveo no caso estudado?','Um medicamento biológico para prevenir crises vaso-oclusivas em pacientes com anemia falciforme.'],['O que são crises vaso-oclusivas?','Episódios dolorosos causados pela obstrução do fluxo sanguíneo, conforme o material.'],['Qual RDC é central?','RDC nº 205/2017.'],['Qual é o compromisso após registro com dados preliminares?','Apresentar dados complementares e estudos mais robustos posteriormente.'],['Por que o registro foi cancelado?','Porque estudos de fase III não mostraram redução das crises em comparação ao placebo.']],
quiz:[['O registro especial para doenças raras permite:', ['Nunca fazer estudos','Usar dados preliminares em situações previstas, mantendo obrigação de evidências posteriores','Dispensar segurança','Registrar qualquer produto'],1,'A resposta correta é a B porque o material explica que etapas podem ser flexibilizadas sem abandonar o monitoramento e a comprovação posterior.'],['O registro do Adakveo foi cancelado porque:', ['Era um medicamento biológico','Os estudos complementares não demonstraram redução das crises em comparação ao placebo','Era caro','Não tinha embalagem'],1,'Essa é a razão apresentada no PDF para o cancelamento do registro.']]
}
];

const app=document.getElementById('app'),nav=document.getElementById('weekNav');
weeks.forEach((w,i)=>{let b=document.createElement('button');b.className='weekBtn'+(!i?' active':'');b.textContent=w.short;b.onclick=()=>showWeek(w.id);nav.appendChild(b)});
function showWeek(id){document.querySelectorAll('.week').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');[...nav.children].forEach((b,i)=>b.classList.toggle('active',weeks[i].id===id));window.scrollTo({top:0,behavior:'smooth'})}
function weekHTML(w,index){return `<section class="week ${index===0?'active':''}" id="${w.id}"><div class="card weekHead"><h2>${w.title}</h2><p>Esta semana está totalmente separada das outras. Primeiro você estuda a explicação completa; depois pode ir para flashcards, revisão ou quiz somente desta semana.</p></div><div class="tabs"><button class="tabBtn active" onclick="tab('${w.id}','exp')">Explicação completa</button><button class="tabBtn" onclick="tab('${w.id}','flash')">Flashcards</button><button class="tabBtn" onclick="tab('${w.id}','rev')">Revisão de 2 minutos</button><button class="tabBtn" onclick="tab('${w.id}','quiz')">Quiz da semana</button></div><div class="tab active" data-week="${w.id}" data-tab="exp"><div class="card"><h2>Explicação passo a passo</h2>${w.sections.map(s=>`<div class="box"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div><div class="controls">${index>0?`<button class="btn secondary" onclick="showWeek('${weeks[index-1].id}')">Semana anterior</button>`:''}${index<weeks.length-1?`<button class="btn" onclick="showWeek('${weeks[index+1].id}')">Ir para a próxima semana</button>`:''}</div></div><div class="tab" data-week="${w.id}" data-tab="flash"><div class="card"><h2>Flashcards importantes</h2><p class="small">Clique no cartão para virar. Use os botões para estudar um por vez.</p><div id="fc-${w.id}"></div><div class="controls"><button class="btn secondary" onclick="prevCard('${w.id}')">Anterior</button><button class="btn" onclick="nextCard('${w.id}')">Próximo flashcard</button></div></div></div><div class="tab" data-week="${w.id}" data-tab="rev"><div class="card"><h2>Revisão de 2 minutos</h2><div class="review">${w.sections.slice(0,Math.min(6,w.sections.length)).map(s=>`<p><b>${s[0]}:</b> ${s[1]}</p>`).join('')}</div></div></div><div class="tab" data-week="${w.id}" data-tab="quiz"><div class="card"><h2>Quiz da ${w.short}</h2><p>Se você errar, o site mostra a resposta correta e explica exatamente por que ela é a correta com base no conteúdo desta semana.</p><div id="quiz-${w.id}"></div></div></div></section>`}
app.innerHTML=weeks.map(weekHTML).join('');

function tab(w,t){document.querySelectorAll(`[data-week="${w}"]`).forEach(x=>x.classList.toggle('active',x.dataset.tab===t));document.querySelectorAll(`#${w} .tabBtn`).forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().includes(t==='exp'?'explicação':t==='flash'?'flashcards':t==='rev'?'revisão':'quiz')))}
const ci={};weeks.forEach(w=>ci[w.id]=0);
function renderCard(id){let w=weeks.find(x=>x.id===id),c=w.cards[ci[id]],el=document.getElementById('fc-'+id);el.innerHTML=`<div class="flash" onclick="this.classList.toggle('flip')"><div class="flashin"><div class="face">${c[0]}<br><span class="small">Clique para virar</span></div><div class="face back">${c[1]}</div></div></div>`}
function nextCard(id){let w=weeks.find(x=>x.id===id);ci[id]=(ci[id]+1)%w.cards.length;renderCard(id)}function prevCard(id){let w=weeks.find(x=>x.id===id);ci[id]=(ci[id]-1+w.cards.length)%w.cards.length;renderCard(id)}
weeks.forEach(w=>renderCard(w.id));
const qstate={};weeks.forEach(w=>qstate[w.id]={i:0,score:0,lock:false});
function renderQuiz(id){let w=weeks.find(x=>x.id===id),s=qstate[id],el=document.getElementById('quiz-'+id);if(s.i>=w.quiz.length){el.innerHTML=`<h3>Quiz concluído</h3><p><b>Resultado: ${s.score} de ${w.quiz.length} acertos.</b></p><button class="btn secondary" onclick="restartQuiz('${id}')">Refazer este quiz</button>`;return}let q=w.quiz[s.i];el.innerHTML=`<div class="q">${s.i+1}. ${q[0]}</div><div class="opts">${q[1].map((o,i)=>`<button class="opt" onclick="answer('${id}',${i})">${String.fromCharCode(65+i)}) ${o}</button>`).join('')}</div><div id="fb-${id}" class="feedback"></div>`;s.lock=false}
function answer(id,ans){let w=weeks.find(x=>x.id===id),s=qstate[id];if(s.lock)return;s.lock=true;let q=w.quiz[s.i],ok=ans===q[2],fb=document.getElementById('fb-'+id);if(ok)s.score++;fb.className='feedback show '+(ok?'ok':'bad');fb.innerHTML=ok?`<b>Resposta correta.</b><br>${q[3]}`:`<b>Resposta incorreta.</b><br>Você marcou <b>${q[1][ans]}</b>.<br><br><b>A resposta correta é: ${q[1][q[2]]}.</b><br><br><b>Por quê?</b> ${q[3]}<br><br><span class="small">Essa explicação está ligada ao conteúdo estudado nesta própria semana.</span>`;fb.innerHTML+=`<div><button class="btn" style="margin-top:12px" onclick="nextQ('${id}')">${s.i===w.quiz.length-1?'Ver resultado':'Próxima questão'}</button></div>`}
function nextQ(id){qstate[id].i++;renderQuiz(id)}function restartQuiz(id){qstate[id]={i:0,score:0,lock:false};renderQuiz(id)}
weeks.forEach(w=>renderQuiz(w.id));
</script></body></html>
